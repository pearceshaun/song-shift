[project]
name = "song-shift"
version = "0.1.0"
description = "Migrate playlists between music streaming services"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "tidalapi>=0.7",
    "PyJWT[crypto]>=2.8",
    "rapidfuzz>=3.6",
    "shazamio>=0.7",
]

[project.scripts]
song-shift = "song_shift.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
